<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de la rifa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
/* Layout: talonario de rifa. Cabecera tipo boleta, resumen de avance, tablero 10x10, reglas. Una columna, pensada para celular. */
:root{
  --paper:#f4f6f1; --card:#ffffff; --ink:#12302c; --muted:#5d716c; --line:#d3dbd4;
  --accent:#c2185b; --paid:#12302c; --paid-ink:#ffffff; --hold:#f4c430; --hold-ink:#3a2c00;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1b19; --card:#162724; --ink:#eaf2ee; --muted:#9db1ab; --line:#2c423d;
    --accent:#ff6fa5; --paid:#d9efe7; --paid-ink:#0e1b19; --hold:#e0b21e; --hold-ink:#221a00;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1b19; --card:#162724; --ink:#eaf2ee; --muted:#9db1ab; --line:#2c423d;
  --accent:#ff6fa5; --paid:#d9efe7; --paid-ink:#0e1b19; --hold:#e0b21e; --hold-ink:#221a00;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05;font-weight:800}
h2{font-size:18px;font-weight:600}
p{margin:0}
.ticket{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.ticket-top{padding:18px 18px 14px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.prize{font-size:17px;font-weight:600}
.tear{border-top:1.5px dashed var(--ink);display:grid;grid-template-columns:1fr 1fr}
.tear div{padding:12px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tear div+div{border-left:1.5px dashed var(--ink)}
.k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.v{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.v.big{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.winner{background:var(--accent);color:#fff;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.winner .num{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.progress{display:flex;flex-direction:column;gap:8px}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.count{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .bp{background:var(--paid)} .bar .bh{background:var(--hold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink);display:inline-block}
.sw.h{background:var(--hold);border-color:var(--hold)} .sw.p{background:var(--paid);border-color:var(--paid)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cell{aspect-ratio:1;border:1.5px solid var(--ink);border-radius:7px;background:var(--card);color:var(--ink);font:700 13px var(--body);font-variant-numeric:tabular-nums;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cell.h{background:var(--hold);border-color:var(--hold);color:var(--hold-ink)}
.cell.p{background:var(--paid);border-color:var(--paid);color:var(--paid-ink);text-decoration:line-through;text-decoration-thickness:1.5px}
.cell.w{outline:3px solid var(--accent);outline-offset:1px}
.cell:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rules{white-space:pre-wrap;color:var(--ink);font-size:15px}
.muted{color:var(--muted);font-size:14px}
.btn{font:700 15px var(--body);border-radius:10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:7px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.list{display:flex;flex-direction:column;font-size:14px}
.list div{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
.list b{font-variant-numeric:tabular-nums;min-width:26px}
.list em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:4px}
input[type=text],textarea{font:500 16px var(--body);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:110px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:700 14px var(--body);padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet .num{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ink);color:var(--paper);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.savebar span{font-weight:600;font-size:14px}
.savebar .btn{border-color:var(--paper)}
.msg{font-size:14px;font-weight:600;color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="root"></main>
<script>
(function(){
  var API = 'https://zctrbnjzmydeuwjyikiy.supabase.co/rest/v1/';
  var KEY = 'sb_publishable_V_KZYzsM1qObGbu6rKcckg_EJzqHWbs';
  var S = {cfg:{titulo:'Rifa', premio:'', precio:0, loteria:'', fecha:'', whatsapp:'', pago:'', organizador:'', reglas:''}, nums:{}, ganador:''};
  var root = document.getElementById('root');
  var loaded = false, failed = false, busy = false, admin = false, clave = '', sheet = null, note = '';
  var money = new Intl.NumberFormat('es-CO');
  try { clave = localStorage.getItem('rifa_clave') || ''; admin = !!clave; } catch (e) {}
  function pad(i){ return (i < 10 ? '0' : '') + i; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function api(path, body){
    var opt = {headers:{apikey:KEY, 'Content-Type':'application/json'}, cache:'no-store'};
    if (body){ opt.method = 'POST'; opt.body = JSON.stringify(body); }
    return fetch(API + path, opt).then(function(r){
      return r.text().then(function(t){
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok){ var err = new Error((j && j.message) || ('Error ' + r.status)); throw err; }
        return j;
      });
    });
  }
  function load(){
    return Promise.all([api('rifa_config?select=data&id=eq.1'), api('rifa_numeros?select=numero,nombre,estado')]).then(function(res){
      var d = res[0] && res[0][0] ? res[0][0].data : null, i, r;
      if (d && d.cfg){ S.cfg = d.cfg; S.ganador = d.ganador || ''; }
      S.nums = {};
      for (i = 0; i < res[1].length; i++){ r = res[1][i]; S.nums[r.numero] = {n:r.nombre, s:r.estado}; }
      loaded = true; failed = false;
      document.title = S.cfg.titulo || 'Tablero de la rifa';
      if (!sheet || sheet.t === 'num' && !admin) render();
    }).catch(function(){ if (!loaded){ failed = true; render(); } });
  }
  function stats(){
    var p = 0, h = 0, k;
    for (k in S.nums){ if (S.nums[k].s === 'p') p++; else if (S.nums[k].s === 'a') h++; }
    return {p:p, h:h, free:100 - p - h};
  }
  function waLink(text){
    var d = String(S.cfg.whatsapp || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.length === 10) d = '57' + d;
    return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);
  }
  function freeList(){
    var out = [], i;
    for (i = 0; i < 100; i++){ if (!S.nums[pad(i)]) out.push(pad(i)); }
    return out;
  }
  function render(){
    var st = stats(), c = S.cfg, h = '', i, n, e, cls;
    if (!loaded){
      root.innerHTML = '<section class="card"><h2>' + (failed ? 'No se pudo cargar el tablero' : 'Cargando el tablero…') + '</h2>' +
        (failed ? '<p class="muted">Revisa tu conexión a internet y vuelve a intentar.</p><div class="row"><button type="button" class="btn primary" data-act="retry">Reintentar</button></div>' : '') + '</section>';
      return;
    }
    h += '<section class="ticket"><div class="ticket-top"><span class="eyebrow">Rifa organizada por ' + esc(c.organizador) + '</span><h1>' + esc(c.titulo) + '</h1><p class="prize">' + esc(c.premio) + '</p></div>' +
      '<div class="tear"><div><span class="k">Valor del número</span><span class="v big">$' + money.format(c.precio) + '</span></div><div><span class="k">Juega</span><span class="v">' + esc(c.fecha) + '</span></div></div>' +
      '<div class="tear" style="grid-template-columns:1fr"><div><span class="k">Con</span><span class="v">' + esc(c.loteria) + '</span></div></div></section>';
    if (S.ganador){
      e = S.nums[S.ganador];
      h += '<section class="winner"><span class="k" style="color:#fff">Número ganador</span><span class="num">' + esc(S.ganador) + '</span><span>' + (e ? 'Ganó ' + esc(e.n || 'el comprador de este número') : 'Este número no se vendió. Se juega con el siguiente sorteo.') + '</span></section>';
    }
    h += '<section class="progress"><div class="progress-row"><span class="count">' + (st.p + st.h) + ' de 100 tomados</span><span class="muted">Quedan ' + st.free + ' libres</span></div>' +
      '<div class="bar" role="img" aria-label="' + st.p + ' pagados, ' + st.h + ' apartados"><i class="bp" style="width:' + st.p + '%"></i><i class="bh" style="width:' + st.h + '%"></i></div>' +
      '<div class="legend"><span><i class="sw"></i>Libre</span><span><i class="sw h"></i>Apartado</span><span><i class="sw p"></i>Pagado</span></div></section>';
    h += '<section class="grid" aria-label="Tablero de números">';
    for (i = 0; i < 100; i++){
      n = pad(i); e = S.nums[n];
      cls = 'cell' + (e ? (e.s === 'p' ? ' p' : ' h') : '') + (S.ganador === n ? ' w' : '');
      h += '<button type="button" class="' + cls + '" data-n="' + n + '" aria-label="Número ' + n + (e ? (e.s === 'p' ? ', pagado' : ', apartado') : ', libre') + '">' + n + '</button>';
    }
    h += '</section><p class="muted">Toca un número para ver si está libre' + (admin ? ' o para editarlo.' : ' y pedirlo.') + '</p>';
    h += '<section class="card"><h2>Cómo pagar</h2><p>' + esc(c.pago) + '</p></section>';
    h += '<section class="card"><h2>Reglas</h2><p class="rules">' + esc(c.reglas) + '</p></section>';
    if (admin){
      var paid = st.p * c.precio, hold = st.h * c.precio, rows = '', keys = Object.keys(S.nums).sort();
      for (i = 0; i < keys.length; i++){ e = S.nums[keys[i]]; rows += '<div><b>' + keys[i] + '</b><span>' + esc(e.n || 'Sin nombre') + '</span><em>' + (e.s === 'p' ? 'PAGADO' : 'APARTADO') + '</em></div>'; }
      h += '<section class="card"><h2>Solo para ti: cuentas</h2><div class="money"><div><span class="k">Recibido</span><div class="v big">$' + money.format(paid) + '</div></div><div><span class="k">Por cobrar</span><div class="v big">$' + money.format(hold) + '</div></div></div>' +
        '<p class="muted">Esta sección solo aparece en modo organizador, pero los nombres que escribas sí los ve quien toque un número.</p>' +
        (rows ? '<div class="list">' + rows + '</div>' : '<p class="muted">Aún no hay números tomados.</p>') +
        '<div class="row"><button type="button" class="btn" data-act="cfg">Editar datos de la rifa</button><button type="button" class="btn" data-act="copy">Copiar mensaje para WhatsApp</button></div>' +
        '<div class="row"><button type="button" class="btn" data-act="win">Registrar número ganador</button><button type="button" class="btn" data-act="exit">Salir del modo organizador</button></div>' +
        (note ? '<p class="msg" role="status">' + esc(note) + '</p>' : '') + '</section>';
    } else {
      h += '<div class="row"><button type="button" class="btn small" data-act="login">Soy el organizador</button></div>';
    }
    if (sheet) h += renderSheet();
    root.innerHTML = h;
  }
  function renderSheet(){
    var h = '<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">', e, link, dis = busy ? ' disabled' : '';
    if (sheet.t === 'num'){
      e = S.nums[sheet.n];
      h += '<span class="k">Número</span><span class="num">' + sheet.n + '</span>';
      if (admin){
        h += '<label for="f-name">Nombre del comprador<input type="text" id="f-name" autocomplete="off" maxlength="60" value="' + esc(sheet.name) + '"></label>' +
          '<div class="seg" role="group" aria-label="Estado"><button type="button" data-st="" aria-pressed="' + (sheet.s === '') + '">Libre</button><button type="button" data-st="a" aria-pressed="' + (sheet.s === 'a') + '">Apartado</button><button type="button" data-st="p" aria-pressed="' + (sheet.s === 'p') + '">Pagado</button></div>' +
          '<div class="row"><button type="button" class="btn primary" data-act="savenum"' + dis + '>' + (busy ? 'Guardando…' : 'Guardar') + '</button><button type="button" class="btn" data-act="close">Cancelar</button></div>';
      } else if (e){
        h += '<p>' + (e.s === 'p' ? 'Ya está pagado' : 'Está apartado') + (e.n ? ' por ' + esc(e.n) : '') + '.</p><div class="row"><button type="button" class="btn" data-act="close">Ver otros números</button></div>';
      } else {
        link = waLink('Hola, quiero el número ' + sheet.n + ' de la rifa "' + S.cfg.titulo + '".');
        h += '<p>Está libre. Vale $' + money.format(S.cfg.precio) + '.</p>' +
          (link ? '<div class="row"><a class="btn accent" href="' + esc(link) + '" target="_blank" rel="noopener">Pedirlo por WhatsApp</a></div>' : '<p class="muted">Escríbele a ' + esc(S.cfg.organizador) + ' para apartarlo.</p>') +
          '<div class="row"><button type="button" class="btn" data-act="close">Ver otros números</button></div>';
      }
    } else if (sheet.t === 'login'){
      h += '<h2>Entrar como organizador</h2><label for="l-clave">Clave del organizador<input type="text" id="l-clave" autocomplete="off" autocapitalize="none" spellcheck="false"></label>' +
        '<div class="row"><button type="button" class="btn primary" data-act="dologin"' + dis + '>' + (busy ? 'Revisando…' : 'Entrar') + '</button><button type="button" class="btn" data-act="close">Cancelar</button></div>';
    } else if (sheet.t === 'cfg'){
      var c = S.cfg;
      h += '<h2>Datos de la rifa</h2>' +
        '<label for="c-titulo">Título<input type="text" id="c-titulo" value="' + esc(c.titulo) + '"></label>' +
        '<label for="c-premio">Premio<input type="text" id="c-premio" value="' + esc(c.premio) + '"></label>' +
        '<label for="c-precio">Valor de cada número (solo cifras)<input type="text" inputmode="numeric" id="c-precio" value="' + esc(c.precio) + '"></label>' +
        '<label for="c-loteria">Con qué lotería juega<input type="text" id="c-loteria" value="' + esc(c.loteria) + '"></label>' +
        '<label for="c-fecha">Fecha del sorteo<input type="text" id="c-fecha" value="' + esc(c.fecha) + '"></label>' +
        '<label for="c-organizador">Tu nombre<input type="text" id="c-organizador" value="' + esc(c.organizador) + '"></label>' +
        '<label for="c-whatsapp">Tu WhatsApp (para el botón de pedir número)<input type="text" inputmode="tel" id="c-whatsapp" value="' + esc(c.whatsapp) + '"></label>' +
        '<label for="c-pago">Cómo pagar<input type="text" id="c-pago" value="' + esc(c.pago) + '"></label>' +
        '<label for="c-reglas">Reglas<textarea id="c-reglas">' + esc(c.reglas) + '</textarea></label>' +
        '<div class="row"><button type="button" class="btn primary" data-act="savecfg"' + dis + '>' + (busy ? 'Guardando…' : 'Guardar') + '</button><button type="button" class="btn" data-act="close">Cancelar</button></div>';
    } else if (sheet.t === 'win'){
      h += '<h2>Número ganador</h2><label for="w-num">Dos últimas cifras del sorteo (déjalo vacío para quitarlo)<input type="text" inputmode="numeric" maxlength="2" id="w-num" value="' + esc(S.ganador) + '"></label>' +
        '<div class="row"><button type="button" class="btn primary" data-act="savewin"' + dis + '>' + (busy ? 'Guardando…' : 'Guardar') + '</button><button type="button" class="btn" data-act="close">Cancelar</button></div>';
    }
    if (sheet.err) h += '<p class="msg" role="alert">' + esc(sheet.err) + '</p>';
    return h + '</div></div>';
  }
  function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function keep(ids){ var o = {}, i; for (i = 0; i < ids.length; i++) o[ids[i]] = val(ids[i]); return o; }
  function restore(o){ var k, el; for (k in o){ el = document.getElementById(k); if (el) el.value = o[k]; } }
  function fail(err, fields){
    busy = false;
    if (/clave_incorrecta/.test(err.message)){
      sheet.err = 'La clave no es correcta.';
      if (sheet.t !== 'login'){ admin = false; clave = ''; try { localStorage.removeItem('rifa_clave'); } catch (e) {} sheet = {t:'login', err:'La clave guardada ya no sirve. Escríbela de nuevo.'}; }
    } else {
      sheet.err = 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
    }
    render(); if (fields) restore(fields);
  }
  function done(msg){ busy = false; sheet = null; note = msg || ''; return load().then(render); }
  function saveCfg(cfg, ganador, fields){
    busy = true; render(); restore(fields);
    api('rpc/rifa_guardar_config', {p_clave:clave, p_data:{cfg:cfg, ganador:ganador}}).then(function(){ return done('Cambios guardados.'); }).catch(function(e){ fail(e, fields); });
  }
  root.addEventListener('click', function(ev){
    var t = ev.target, cell = t.closest('.cell'), stb = t.closest('[data-st]'), act = t.closest('[data-act]'), a, e, w, f, c;
    if (cell){
      e = S.nums[cell.getAttribute('data-n')];
      sheet = {t:'num', n:cell.getAttribute('data-n'), name:e ? (e.n || '') : '', s:e ? e.s : (admin ? 'a' : '')};
      render(); return;
    }
    if (stb){ sheet.name = val('f-name'); sheet.s = stb.getAttribute('data-st'); render(); return; }
    if (!act || busy) return;
    a = act.getAttribute('data-act');
    if (a === 'close'){ if (act.classList.contains('scrim') && t !== act) return; sheet = null; render(); }
    else if (a === 'retry'){ failed = false; render(); load(); }
    else if (a === 'login'){ sheet = {t:'login'}; render(); }
    else if (a === 'dologin'){
      w = val('l-clave'); if (!w) return;
      busy = true; render();
      api('rpc/rifa_entrar', {p_clave:w}).then(function(){
        clave = w; admin = true; try { localStorage.setItem('rifa_clave', w); } catch (e2) {}
        busy = false; sheet = null; note = ''; render();
      }).catch(function(err){ fail(err); });
    }
    else if (a === 'exit'){ admin = false; clave = ''; note = ''; try { localStorage.removeItem('rifa_clave'); } catch (e3) {} render(); }
    else if (a === 'cfg'){ sheet = {t:'cfg'}; render(); }
    else if (a === 'win'){ sheet = {t:'win'}; render(); }
    else if (a === 'savenum'){
      sheet.name = val('f-name'); busy = true; render();
      api('rpc/rifa_guardar_numero', {p_clave:clave, p_numero:sheet.n, p_nombre:sheet.name, p_estado:sheet.s}).then(function(){ return done(''); }).catch(function(err){ fail(err); });
    }
    else if (a === 'savecfg'){
      f = keep(['c-titulo','c-premio','c-precio','c-loteria','c-fecha','c-organizador','c-whatsapp','c-pago','c-reglas']);
      c = {titulo:f['c-titulo'] || S.cfg.titulo, premio:f['c-premio'], loteria:f['c-loteria'], fecha:f['c-fecha'], organizador:f['c-organizador'], whatsapp:f['c-whatsapp'], pago:f['c-pago'], reglas:f['c-reglas'],
        precio:parseInt(f['c-precio'].replace(/\D/g, ''), 10) || S.cfg.precio};
      saveCfg(c, S.ganador, f);
    }
    else if (a === 'savewin'){
      f = keep(['w-num']); w = f['w-num'].replace(/\D/g, '');
      saveCfg(S.cfg, w === '' ? '' : pad(parseInt(w, 10) % 100), f);
    }
    else if (a === 'copy'){
      var st = stats(), txt = S.cfg.titulo + '\nPremio: ' + S.cfg.premio + '\nValor: $' + money.format(S.cfg.precio) + '\nJuega: ' + S.cfg.fecha + ' con ' + S.cfg.loteria + '\nVan ' + (st.p + st.h) + ' de 100.\nNúmeros libres: ' + freeList().join(' ') + '\nTablero: ' + location.href.split('#')[0];
      try { navigator.clipboard.writeText(txt).then(function(){ note = 'Mensaje copiado. Pégalo en WhatsApp.'; render(); }, function(){ note = 'No se pudo copiar desde aquí.'; render(); }); }
      catch (err2){ note = 'No se pudo copiar desde aquí.'; render(); }
    }
  });
  render();
  load();
  setInterval(function(){ if (!document.hidden && !busy && !sheet) load(); }, 30000);
})();
</script>
